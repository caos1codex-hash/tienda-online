<!doctype html>
<html lang="es-PY">
  <head>
    <meta charset="utf-8" />
    <title>TechNova PY — Tienda Online Premium de Tecnología</title>
    <!--
      SPA redirect for GitHub Pages.
      Cuando GitHub Pages recibe una URL que no existe (ej. /tienda-online/catalogo),
      sirve este 404.html. El script convierte la ruta en query string y redirige a index.html,
      donde otro script (en index.html) restaura la ruta original para React Router.
      Crédito: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      // Set this to the number of segments in your repo path.
      // For https://username.github.io/tienda-online/ the path segment count is 1.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
    <meta http-equiv="refresh" content="0; url=." />
  </head>
  <body>
    <p>Redirigiendo… Si no se redirige automáticamente, <a href=".">hacé clic aquí</a>.</p>
  </body>
</html>
